services:
  - type: web
    name: mailing-enderecos
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mailing-enderecos-db
          property: connectionString

databases:
  - name: mailing-enderecos-db
    plan: free
    databaseName: mailing_enderecos
    user: mailing_enderecos
